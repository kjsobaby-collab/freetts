[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-tts"
version = "0.1.1"
description = "Lecture script -> English narration (mp3/wav) + subtitles, with free local TTS engines"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "soundfile",
    "num2words",
    "PyYAML",
    "pydantic>=2",
    "typer",
    "rich",
    "charset-normalizer",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "huggingface_hub"]
piper = ["piper-tts>=1.3"]
azure = ["azure-cognitiveservices-speech", "keyring", "python-dotenv"]
docx = ["python-docx"]
gui = ["PySide6>=6.6"]
dev = ["pytest", "pytest-asyncio", "pytest-qt"]

[project.scripts]
lecture-tts = "lecture_tts.cli:main"

[project.gui-scripts]
lecture-tts-gui = "lecture_tts.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecture_tts = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
